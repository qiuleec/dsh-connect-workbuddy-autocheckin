# pnpm 11 settings. `pnpm-workspace.yaml` is the only place these are read from
# in pnpm 11: a `pnpm` key in package.json is silently ignored, and the old
# `onlyBuiltDependencies` list alone does NOT silence the unapproved-build error.
#
# WHY THIS FILE EXISTS
#
# CI failed with:
#
#   [ERR_PNPM_IGNORED_BUILDS] Ignored build scripts:
#     @google/genai@1.52.0, @google/genai@2.21.0, protobufjs@7.6.6
#   Run "pnpm approve-builds" to pick which dependencies should be allowed...
#
# Even though the install itself succeeded. pnpm keeps a tri-state per package:
#
#   true      -> run the script
#   false     -> skip it, and RECORD that the decision was made
#   undefined -> undecided, so pnpm reports it and exits 1
#
# `onlyBuiltDependencies` can only express "true". Listing nothing there leaves
# these three UNDECIDED, which is exactly the failing state. `allowBuilds` is the
# map that can say `false` — the deliberate "never build this".
#
# WHERE THEY COME FROM
#
# They are not dependencies of this plugin. They arrive transitively through the
# base plugin's optional peer:
#
#   dsh-connect-workbuddy -> @earendil-works/pi-ai
#                         -> @google/genai -> protobufjs
#
# This plugin's own runtime dependency is @deepseek-ai/schemastery, and its peer
# dsh-connect-workbuddy is provided by the host profile. Nothing here imports,
# runs, or needs a postinstall step from any of them, so all three are false.
allowBuilds:
  '@google/genai': false
  protobufjs: false
